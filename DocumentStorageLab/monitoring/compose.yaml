services:
  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-18381}:9090"]
    volumes: ["./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro", "./monitoring/alerts.yaml:/etc/prometheus/alerts.yml:ro", "prometheus-data:/prometheus"]
    networks: [monitoring, monitoring-ui]
    cpus: 0.5
    mem_limit: 256m
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.2.3
    profiles: [monitoring]
    ports: ["127.0.0.1:${GRAFANA_PORT:-18382}:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes: ["./monitoring/provisioning:/etc/grafana/provisioning:ro", "./monitoring/dashboards:/var/lib/grafana/dashboards:ro", "grafana-data:/var/lib/grafana"]
    networks: [monitoring, monitoring-ui]
    cpus: 0.5
    mem_limit: 384m
    restart: unless-stopped
volumes:
  prometheus-data: {}
  grafana-data: {}
networks:
  monitoring-ui: {}
