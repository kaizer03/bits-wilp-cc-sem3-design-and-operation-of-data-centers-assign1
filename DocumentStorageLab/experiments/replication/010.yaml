# Run as an isolated assignment-only project; volumes and data are separate.
services:
  api:
    environment:
      REPLICATION: "010"
  api2:
    environment:
      REPLICATION: "010"
  master:
    command: ["master", "-ip=master", "-ip.bind=0.0.0.0", "-mdir=/data", "-volumeSizeLimitMB=32", "-defaultReplication=010"]
  volume2:
    command: ["volume", "-ip=volume2", "-ip.bind=0.0.0.0", "-port=8080", "-master=master:9333", "-dir=/data", "-max=8", "-dataCenter=lab", "-rack=rack2"]
  volume3:
    command: ["volume", "-ip=volume3", "-ip.bind=0.0.0.0", "-port=8080", "-master=master:9333", "-dir=/data", "-max=8", "-dataCenter=lab", "-rack=rack3"]
