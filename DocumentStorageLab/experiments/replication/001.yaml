# Run as an isolated assignment-only project; volumes and data are separate.
services:
  api:
    environment:
      REPLICATION: "001"
  api2:
    environment:
      REPLICATION: "001"
  master:
    command: ["master", "-ip=master", "-ip.bind=0.0.0.0", "-mdir=/data", "-volumeSizeLimitMB=32", "-defaultReplication=001"]
