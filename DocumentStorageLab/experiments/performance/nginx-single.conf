events {}
http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream document_api {
        zone document_api 64k;
        server api:3000 resolve max_fails=1 fail_timeout=5s;
    }
    server {
        listen 80;
        client_max_body_size 6m;
        location / {
            proxy_pass http://document_api;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 8s;
            # Never enable non_idempotent: a sent upload/change must not be replayed.
        }
    }
}
